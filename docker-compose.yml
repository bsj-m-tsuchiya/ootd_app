services:
  web:
    build: .
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://ootd:ootd_password@db:5432/ootd
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - db
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npx prisma db push && npm run dev"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ootd
      POSTGRES_PASSWORD: ootd_password
      POSTGRES_DB: ootd
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  node_modules:
  postgres_data:
